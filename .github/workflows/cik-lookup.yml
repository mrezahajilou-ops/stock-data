name: CIK lookup (manual helper)
on:
  workflow_dispatch:
    inputs:
      q:
        description: 'names separated by ;'
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/cik_lookup.py
          sparse-checkout-cone-mode: false
      - run: python tools/cik_lookup.py "${{ inputs.q }}"
