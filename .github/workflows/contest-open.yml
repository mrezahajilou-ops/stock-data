name: contest-open
# Manual: today's regular-session open price (Yahoo) for every ticker held in the contest + SPY. Public market data only.
on: workflow_dispatch
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          import urllib.parse
          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36',
               'Accept': 'application/json, text/plain, */*', 'Origin': 'https://www.nasdaq.com', 'Referer': 'https://www.nasdaq.com/'}
          def get(u, h=H):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=30).read())
          held = get('https://rz-events.mreza-hajilou.workers.dev/c/tickers', {'User-Agent': 'rz-contest'}).get('t') or []
          ETF = {'SPY','QQQ','VOO','DIA','IWM','VTI','VT','VXUS','EFA','EEM','GLD','IAU','SLV','GDX','IBIT','FBTC','ETHA','TLT','IEF','SHY','BND','AGG','LQD','HYG','VNQ','XLK','XLF','XLE','XLV','XLY','XLP','XLI','XLU','XLB','XLC','XLRE','SMH','SOXX','ARKK','SCHD','VIG','VYM','JEPI','USO','UNG','DBC'}
          OPEN_MS = 1794234600000  # 2026-11-09 09:30 ET
          out = {}
          for t in sorted(set(held + ['SPY'])):
              for a in range(3):
                  try:
                      j = get('https://api.nasdaq.com/api/quote/%s/chart?assetclass=%s' % (urllib.parse.quote(t.replace('-', '.')), 'etf' if t in ETF else 'stocks'))
                      pts = [p for p in ((j.get('data') or {}).get('chart') or []) if p.get('x', 0) >= OPEN_MS]
                      out[t] = [pts[0]['y'], pts[0]['z']['dateTime']] if pts else 'NOPTS'
                      break
                  except Exception as e:
                      out[t] = 'ERR ' + str(e)[:40]; time.sleep(2)
              time.sleep(0.3)
          print('OPENJSON', json.dumps(out, separators=(',', ':')))
          PY
