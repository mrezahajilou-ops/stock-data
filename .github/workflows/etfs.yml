name: ETF data (daily)

on:
  schedule:
    - cron: '41 7 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these tickers (space separated), for a test run'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: etfs
  cancel-in-progress: false

jobs:
  etfs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ETF data
        run: python3 etf_data.py ${{ inputs.only }}
      - name: Persian pages (same builder as the other editions)
        run: python3 etf_fa_web.py
      - name: Commit
        run: |
          git config user.name  "stockanaliz bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/etfs web/etf
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ETF data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main || true
          done
