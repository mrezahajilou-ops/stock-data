name: Deploy events worker (Cloudflare)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['events/**']

permissions:
  contents: write

concurrency:
  group: events-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify token
        run: |
          curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys;j=json.load(sys.stdin);print('token:',j['result']['status'] if j.get('success') else j['errors'])"
      - name: Create D1 database (first run) and remember its id
        working-directory: events
        run: |
          if grep -q REPLACE_AFTER_D1_CREATE wrangler.toml; then
            npx -y wrangler@latest d1 create rz-events >/tmp/d1.txt 2>&1 || true
            cat /tmp/d1.txt
            ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1.txt | head -1)
            if [ -z "$ID" ]; then ID=$(npx -y wrangler@latest d1 list --json | python3 -c "import json,sys;print([d['uuid'] for d in json.load(sys.stdin) if d['name']=='rz-events'][0])"); fi
            sed -i "s/REPLACE_AFTER_D1_CREATE/$ID/" wrangler.toml
            echo "database id: $ID"
          fi
      - name: Schema
        working-directory: events
        run: npx -y wrangler@latest d1 execute rz-events --remote --file=schema.sql
      - name: Deploy worker
        working-directory: events
        run: npx -y wrangler@latest deploy 2>&1 | tee /tmp/deploy.txt
      - name: Record the worker URL for the site (gen_web.py EVENTS_URL)
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1)
          echo "worker url: $URL"
          [ -n "$URL" ] || exit 0
          python3 - "$URL" <<'PY'
          import re,sys
          url=sys.argv[1]
          p='gen_web.py'; s=open(p).read()
          s=re.sub(r"EVENTS_URL = '[^']*'", "EVENTS_URL = '%s'" % url, s, count=1)
          open(p,'w').write(s)
          PY
          python3 gen_web.py
          cd events && if git diff --quiet -- wrangler.toml; then :; fi; cd ..
          git config user.name github-actions; git config user.email actions@github.com
          git add gen_web.py web events/wrangler.toml
          git diff --cached --quiet || (git commit -qm "events: worker deployed at $URL; beacon switched on" && git push)
      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -1); [ -n "$URL" ] || exit 0
          curl -sS "$URL/stats?days=7" | head -c 300; echo
          curl -sS -o /dev/null -w "POST /e -> %{http_code}\n" -X POST "$URL/e" -H 'Origin: https://rezahajiloubooks.com' -d '{"k":"view","t":"TEST","u":"deploycheck0001","v":""}'
