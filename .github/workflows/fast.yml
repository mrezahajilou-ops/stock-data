name: Fast lane - new earnings reports (hourly)

# Companies that reported in the last days (SEC EDGAR: 8-K, 10-Q, 10-K, 6-K, 20-F, 40-F) get
#   1. Yahoo's reported quarter (earnings module, updated hours after the release) -> estimates branch
#   2. their SEC facts from the per-company API (minutes after a 10-Q / 10-K is filed, the nightly bulk file is a day behind)
# and the whole data set is rebuilt with them. Results show on the site within the hour instead of after 1-3 days.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      extra:
        description: 'Extra tickers (space separated)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: secbuild
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Who reported
        id: recent
        env:
          EXTRA_TICKERS: ${{ inputs.extra }}
        run: |
          # same SEC contact header as the nightly build (sec-build.yml)
          export SEC_USER_AGENT="$(grep -m1 'SEC_USER_AGENT:' .github/workflows/sec-build.yml | sed 's/.*SEC_USER_AGENT: *//; s/"//g')"
          python recent.py
      - name: Reported quarters from Yahoo (only these companies)
        if: steps.recent.outputs.tickers != ''
        run: |
          python estimates.py ${{ steps.recent.outputs.tickers }} || true
          git clone -q --depth 1 --branch estimates "https://github.com/${{ github.repository }}" est_full || true
          python est_merge.py est_full/est.json estimates/est.json est_merged.json
      - name: Publish merged estimates
        if: steps.recent.outputs.tickers != ''
        run: |
          mkdir -p est_pub && cp est_merged.json est_pub/est.json && cd est_pub
          git init -q -b estimates
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A && git commit -qm "estimates (fast lane) $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" estimates:estimates
      - name: Rebuild data
        if: steps.recent.outputs.tickers != ''
        env:
          FRESH_CIKS: ${{ steps.recent.outputs.ciks }}
          EST_FILE: est_merged.json
        run: |
          export SEC_USER_AGENT="$(grep -m1 'SEC_USER_AGENT:' .github/workflows/sec-build.yml | sed 's/.*SEC_USER_AGENT: *//; s/"//g')"
          mkdir -p scripts
          cp build.py scripts/build.py
          cp dcf_model.py scripts/dcf_model.py
          python scripts/build.py
          python min_screener.py
      - name: Commit data
        if: steps.recent.outputs.tickers != ''
        run: |
          git config user.name "sec-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git commit -m "data: fast lane $(date -u +%FT%H:%MZ)" || echo "no changes"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main || { git rebase --abort 2>/dev/null; sleep $((i*5)); continue; }
            git push && exit 0
            sleep $((i*5))
          done
          echo "push failed after 5 tries"; exit 1
