name: Financials data-quality audit (daily)
# Renders the shared financials widget for the 300 largest companies and fails (GitHub emails the owner) when it breaks,
# when a company's share-count history goes flat, when blank cells grow past the baseline, or when a phrase lacks a translation.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch the keystats and prices branches the widget reads
        run: git fetch -q --depth 1 origin keystats:refs/remotes/origin/keystats prices:refs/remotes/origin/prices
      - name: Audit
        run: node tools/fin2_audit.js 300
