name: Housing sources probe (one-off)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: housing_probe.py, sparse-checkout-cone-mode: false }
      - run: python -u housing_probe.py
