name: Housing market data (stockanaliz.com/housing)

on:
  schedule:
    - cron: '23 */2 * * *'   # every 2 hours (the job takes ~30 s); stamp.txt changes when any source publishes, and the site rebuilds on that
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: housing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            housing.py
            housing_intl.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build housing.json
        run: pip install -q openpyxl && python -u housing.py
      - name: Other countries (housing_<cc>.json)
        run: |
          timeout 900 python -u housing_intl.py || true
          python -c "import json,glob;print('\n'.join(f[8:-5]+':'+json.load(open(f)).get('stamp','') for f in sorted(glob.glob('housing_*.json'))))" >> stamp.txt || true
      - name: Publish to branch "housing" (other branches publish to "housing-test")
        run: |
          B=housing; if [ "${{ github.ref_name }}" != "main" ]; then B=housing-test; fi
          mkdir out && cp housing.json stamp.txt out/ && (cp housing_*.json out/ 2>/dev/null || true) && cd out
          git init -q && git checkout -q -b $B
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "housing $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $B:$B
