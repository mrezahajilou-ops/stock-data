name: Insider trading live feed (SEC Form 4)

# Every 5 minutes: newest Form 4 filings -> branch `insider-live` (live.json), served by the worker at /c/insider.json
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      backfill: {description: 'one-off: also load the last N business days from the daily index', required: false, default: ''}

permissions:
  contents: write

concurrency:
  group: insider-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extras.py
            insider_live.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: |
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/insider-live/live.json?t=$(date +%s)" -o prev.json || rm -f prev.json
          python insider_live.py prev.json ${{ inputs.backfill && format('--backfill={0}', inputs.backfill) || '' }}
      - name: Publish (single commit, no history growth)
        run: |
          cd live
          git init -q -b insider-live
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "insider live $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" insider-live:insider-live
