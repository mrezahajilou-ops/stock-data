name: Key statistics, quarterly statements, analyst detail

on:
  schedule:
    - cron: '50 6 * * 2-6'   # daily after US trading days
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers'
        required: false
        default: 'NVDA'

permissions:
  contents: write

concurrency:
  group: keystats
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            keystats.py
            estimates.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python keystats.py "${{ inputs.tickers || 'NVDA' }}"
      - name: Publish to branch "keystats"
        run: |
          cd keystats
          git init -q -b keystats
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "keystats $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" keystats:keystats
