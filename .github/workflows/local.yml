name: Local exchanges (Tokyo, Seoul, Sao Paulo) EOD
on:
  schedule:
    - cron: '40 9 * * 1-5'    # after the Tokyo and Seoul close
    - cron: '30 22 * * 1-5'   # after the Sao Paulo close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: local
  cancel-in-progress: false
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            estimates.py
            local.py
            local_lists.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep the markets that this run does not refresh
        run: |
          mkdir -p local
          (git fetch -q --depth 1 origin local && git archive origin/local | tar -x -C local) || true
          ls -la local
      - run: python local.py
      - name: Publish to branch "local"
        run: |
          cd local
          git init -q -b local
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "local $(date -u +%FT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" local:local
