name: Portfolio performance (after each quotes refresh)

on:
  workflow_run:
    workflows: ["Live quotes (every 15 min, market hours)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            portfolio.py
            sync_shopify.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update history in Shopify (holdings stay private; nothing is printed)
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python portfolio.py
