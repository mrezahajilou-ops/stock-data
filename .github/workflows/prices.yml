name: Price history (daily, after US close)
on:
  schedule:
    - cron: '40 0 * * 2-6'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Test run: first N tickers or a comma-separated ticker list (publishes to prices-test)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch weekly prices
        run: python prices.py ${{ inputs.limit }}
      - name: Publish to branch "prices" (single commit, no history growth)
        run: |
          cd prices
          if [ -n "${{ inputs.limit }}" ]; then B=prices-test; else B=prices; fi
          git init -b $B
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "prices $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $B:$B
      - name: Official closes into the live quotes (fixes stale evening quotes)
        if: ${{ inputs.limit == '' }}
        run: |
          git fetch -q origin quotes bench
          mkdir -p qfix
          git show origin/quotes:quotes.json > qfix/quotes.json
          git show origin/bench:bench.json > qfix/bench.json || rm -f qfix/bench.json
          python close_fix.py prices qfix
          rm -f qfix/bench.json
          cd qfix
          git init -q -b quotes
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -qm "quotes: official closes $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" quotes:quotes
      - name: Portfolio point with the official closes
        if: ${{ inputs.limit == '' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          QUOTES_FILE: qfix/quotes.json
        run: python portfolio.py
