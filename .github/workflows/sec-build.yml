name: SEC data build (daily, after US close)

on:
  schedule:
    # Tue-Sat 00:20 UTC = after every US trading day (also after the final quotes run at 23:30 UTC)
    - cron: "20 0 * * 2-6"
    # fallback: GitHub sometimes drops a scheduled run (24 Nov 2026: no build after Monday's close, the stock pages kept
    # Friday's prices); this second slot builds only if no build has succeeded yet today
    - cron: "40 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: secbuild
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 2 * * 2-6" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/sec-build.yml/runs?created=>=$(date -u +%F)&status=success" --jq '.total_count' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "already built today"; echo "run=0" >> $GITHUB_OUTPUT; exit 0; fi
          fi
          echo "run=1" >> $GITHUB_OUTPUT
  build:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare scripts
        run: |
          mkdir -p scripts
          [ -f build.py ] && cp build.py scripts/build.py || true
          cp dcf_model.py scripts/dcf_model.py
          [ -f verify.py ] && cp verify.py scripts/verify.py || true
      - name: Build data
        env:
          SEC_USER_AGENT: "Reza Hajilou mreza.hajilou@gmail.com"
        run: python scripts/build.py
      - name: Compact screener file
        run: python min_screener.py
      - name: Verify against reference values
        run: python scripts/verify.py || true
      - name: Compare every stock with an independent source (Yahoo reference values)
        run: |
          mkdir -p estimates
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/estimates/est.json" -o estimates/est.json && python verify_all.py || true
      - name: Commit data
        run: |
          git config user.name "sec-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git commit -m "data: build $(date -u +%F)" || echo "no changes"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main || { git rebase --abort 2>/dev/null; sleep $((i*5)); continue; }
            git push && exit 0
            sleep $((i*5))
          done
          echo "push failed after 5 tries"; exit 1
