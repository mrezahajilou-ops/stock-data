name: Super investors watcher (new 13F -> rebuild)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: si-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            superinvestors.py
            tools/si_watch.py
          sparse-checkout-cone-mode: false
      - name: Current site data
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/superinvestors/index.json" -o index.json || echo '{}' > index.json
      - name: Ask SEC for newer 13F filings
        id: w
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'SahamAnaliz research contact@sahamanaliz.com' }}
        run: python tools/si_watch.py index.json
      - name: Start the rebuild (unless one is running or started < 60 min ago)
        if: steps.w.outputs.NEW == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          busy=$(gh run list -w superinvestors.yml -L 5 --json status -q '[.[] | select(.status!="completed")] | length')
          last=$(gh run list -w superinvestors.yml -L 1 --json createdAt -q '.[0].createdAt')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "running/queued: $busy, last rebuild started ${age}s ago; new: ${{ steps.w.outputs.WHO }}"
          if [ "$busy" = "0" ] && [ "$age" -gt 3600 ]; then
            gh workflow run superinvestors.yml --ref main && echo "rebuild started"
          else
            echo "skip: rebuild running or too recent; next check will start it"
          fi
