name: SEC data build (every 4 days)

on:
  schedule:
    - cron: "40 9 */4 * *"   # 09:40 UTC every 4 days (1st, 5th, 9th… of each month), after SEC refreshes its bulk files
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process N companies (testing)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          SEC_USER_AGENT: "Reza Hajilou mreza.hajilou@gmail.com"
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python scripts/build.py
      - name: Verify against reference values
        run: python scripts/verify.py || true
      - name: Commit data
        run: |
          git config user.name "sec-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git commit -m "data: nightly build $(date -u +%F)" || echo "no changes"
          git push
