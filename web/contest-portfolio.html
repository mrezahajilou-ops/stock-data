/* ============================================================================
   rezahajiloubooks.com — shared visual identity for every tool page.
   Appended after each page's own CSS (gen_web.py), so it only needs to (1) redefine the colour tokens the
   pages already use, (2) restyle the few structural pieces that carried the old look: nav pills, filled
   header bands, bordered cards, 900-weight headings, lime buttons.  #rzc is replaced per page.
   Direction: a private study — near-black warm ground, antique-gold accent used sparingly, serif numerals.
   ============================================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

#rzc{
  --bg:#0C0E12;        /* page ground */
  --card:#15181F;      /* raised surface */
  --card2:#1C2029;     /* second level (tiles inside cards) */
  --line:#262B36;      /* hairlines; used far less than before */
  --ink:#E8E4DA;       /* primary text: warm paper */
  --mut:#8A8F99;       /* secondary text */
  --ac:#C9A961;        /* the one accent: antique gold */
  --lime:#C9A961;      /* legacy token name -> gold, so old "active" states pick up the accent */
  --gold:#C9A961;
  --red:#C8534F;       /* loss */
  --up:#4FA37A;        /* gain */
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  background:var(--bg);color:var(--ink);border-radius:0;padding:18px 22px 48px;line-height:1.75;
  font-feature-settings:'tnum' 1,'lnum' 1;
}
#rzc *{font-family:inherit}
#rzc a{color:var(--ac);text-decoration-color:rgba(201,169,97,.5)}
#rzc a:hover{color:var(--ink)}

/* ---------- navigation: a quiet text row, gold underline on the current page ---------- */
#rzc .nav{gap:2px 22px;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:0}
#rzc .nav a{padding:10px 2px 12px;border:0;border-radius:0;background:none;color:var(--mut)!important;font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
#rzc .nav a:hover{color:var(--ink)!important}
#rzc .nav a.on{background:none;color:var(--ink)!important;border-bottom-color:var(--ac)}

/* ---------- type ---------- */
#rzc h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px;font-variation-settings:'opsz' 72}
#rzc .sub{font-size:14px;color:var(--mut);max-width:72ch;margin-bottom:18px}
#rzc h3{font-weight:600;font-size:15.5px;color:var(--ink);letter-spacing:0}
#rzc b,#rzc strong{font-weight:600}
#rzc .co,#rzc .rzd .co{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
#rzc .co small{color:var(--ac);font-family:'Vazirmatn',sans-serif;font-weight:500}
#rzc .px .p,#rzc .sc .v,#rzc .vbig b,#rzc .rev .bx .big,#rzc .snap b,#rzc .stats b,#rzc .st .v{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-variation-settings:'opsz' 36}
#rzc .px .p{font-size:30px}
#rzc .st .v{font-size:19px}

/* ---------- surfaces: tone instead of borders ---------- */
#rzc .card{background:var(--card);border:0;border-radius:14px;padding:16px 18px;margin-bottom:12px}
#rzc .card .card{background:var(--card2)}
#rzc .st,#rzc .snap div,#rzc .vbig div,#rzc .ist4 div,#rzc .ab-grid>div,#rzc .vcol,#rzc .sc,#rzc .rev .bx,#rzc .perf div,#rzc .relc,#rzc .stats div{background:var(--card2);border:0}
#rzc .relc:hover{border:0;box-shadow:inset 0 0 0 1px var(--ac);transform:none}
#rzc .wide2 .card,#rzc .charts .card,#rzc .two .card{background:var(--card)}
#rzc .tblwrap,#rzc .tw{border:0;border-radius:10px}
#rzc .charts .card{cursor:zoom-in}

/* ---------- table heads: hairline, no filled band ---------- */
#rzc .tbl th,#rzc th,#rzc .proj th,#rzc .sens th,#rzc .antbl th,#rzc table.itb th{background:transparent;color:var(--mut);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--ac);padding:8px 8px}
#rzc .tbl th.grp{border-bottom:0;color:var(--mut)}
#rzc td{border-bottom:1px solid #1A1E26}
#rzc .tbl td.sep{border-left-color:var(--line)}
#rzc tr.sec td,#rzc .sec td{color:var(--ac);font-weight:600;background:transparent}
#rzc th.ttm,#rzc td.ttm{background:rgba(201,169,97,.07);color:var(--ink)}
#rzc th.ttm{color:var(--ac)}

/* ---------- buttons, chips, inputs ---------- */
#rzc .btn{background:var(--ac);color:#15120A!important;font-weight:600;border-radius:10px;padding:9px 18px}
#rzc .btn.ghost{background:transparent;color:var(--ink)!important;border:1px solid var(--line)}
#rzc .btn.ghost:hover{border-color:var(--ac)}
#rzc .lnk{color:var(--ac)}
#rzc .chip,#rzc .rng button,#rzc .tabs button{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500;border-radius:999px}
#rzc .chip:hover,#rzc .rng button:hover{border-color:var(--ac);color:var(--ink)}
#rzc .rng button.on,#rzc .tabs button.on,#rzc .chip.on{background:transparent;border-color:var(--ac);color:var(--ac);font-weight:600}
#rzc input,#rzc select,#rzc .pin,#rzc .tbl input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-weight:500}
#rzc input:focus,#rzc select:focus,#rzc .tbl input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(201,169,97,.15)}
#rzc .search input{font-size:17px;padding:12px 16px}
#rzc .sugg{background:var(--card2);border:1px solid var(--line)}
#rzc .card:has(.sugg){overflow:visible}  /* the shop theme clips .card (overflow:hidden); search suggestions must hang out of the card */
#rzc .sugg{max-height:min(430px,62vh)!important}
#rzc .sugg div:hover{background:#242934}
#rzc .badge{background:rgba(201,169,97,.12);color:var(--ac)}
#rzc .vtag{font-weight:600;border-radius:8px}

/* ---------- semantic colours: muted gain / loss; gold is never "good", it is "important" ---------- */
#rzc .up{color:var(--up)}#rzc .dn{color:var(--red)}
#rzc .vrow.ok b{background:var(--up)}#rzc .vrow.no b{background:var(--red)}
#rzc .vrow.ok em{color:var(--up)}#rzc .vrow.no em{color:var(--red)}
#rzc .good{background:rgba(79,163,122,.16);color:var(--up)}
#rzc .bad{background:rgba(200,83,79,.16);color:#E2807C}
#rzc .mid{background:rgba(201,169,97,.14);color:var(--ac)}
#rzc .vsum .up{color:var(--up)}

/* ---------- quieter secondary text, no 900 weights left ---------- */
#rzc .meta,#rzc .xnote,#rzc .note,#rzc .mut2,#rzc .st .k,#rzc .st .s{color:var(--mut);font-weight:400}
#rzc .stats small,#rzc .snap small,#rzc .vbig small{font-weight:500}
#rzc .quota{color:var(--mut)}
#rzc .tk{color:var(--ac);font-weight:600}
#rzc .sc{color:#15120A;font-weight:600}

/* ---------- the one motion: hero fades in on first paint ---------- */
@media (prefers-reduced-motion:no-preference){
  #rzc .card:first-of-type .head{animation:rz-in .45s ease-out both}
  @keyframes rz-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
#rzc :focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- phones: nav becomes one scrollable row; smaller display sizes ---------- */
@media (max-width:760px){
  #rzc{padding:12px 14px 40px}
  #rzc .nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0 18px;scrollbar-width:none;margin-bottom:14px;padding-bottom:0}
  #rzc .nav::-webkit-scrollbar{display:none}
  #rzc .nav{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}  /* hint: the row scrolls */
  #rzc .nav a{white-space:nowrap;font-size:13.5px;padding:8px 2px 10px;flex:none}
  #rzc h1{font-size:23px}
  #rzc .sub{font-size:13.5px;margin-bottom:12px}
  #rzc .co{font-size:21px}
  #rzc .px .p{font-size:26px}
  #rzc .card{padding:14px;border-radius:12px}
  #rzc .search input{font-size:16px;padding:11px 14px}
}

#rzc .acctbar{display:flex;justify-content:flex-end;margin:0 0 8px}

#rzc .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#rzc .quick button{border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
#rzc .est{color:var(--mut);font-size:13.5px;margin:10px 0 6px;min-height:1.2em}
#rzc .pick{position:relative}
#rzc .sugg{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;margin-top:4px}
#rzc .sugg div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;cursor:pointer;font-weight:400;font-size:13.5px}
#rzc .sugg div:hover{background:var(--card2)}
#rzc .sugg b{direction:ltr;color:var(--gold)}
#rzc .card:has(.sugg){overflow:visible}
#rzc .lock{background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:16px;text-align:center;line-height:2}
@media(max-width:900px){#rzc .mini span:nth-child(n+3){display:none}}
@media(max-width:640px){
  #rzc .cbar a{padding:6px 11px;font-size:13px}
  #rzc .cbar a.back{margin-right:0}
  #rzc .mini{display:none}
  #rzc .ret{border:0;padding:0}
  #rzc .pcard{grid-template-columns:34px minmax(0,1fr) auto;padding:10px 12px;gap:4px 10px;min-height:clamp(92px,calc((100vh - 250px)/5),120px)}
  #rzc .pcard .rk{font-size:21px}
  #rzc .ret{min-width:76px}#rzc .ret .v{font-size:21px}
  #rzc .sum{grid-template-columns:1fr 1fr}
  #rzc .sum div:first-child{grid-column:1/-1}
  #rzc .ht .mh{display:none}
  #rzc .ht td,#rzc .ht th{padding:8px 4px;font-size:13px}
  #rzc .sum b{font-size:17px}
  #rzc .card{padding:14px 12px}
}

<script>
(function(){

var API=window.RZS_API||'https://raw.githubusercontent.com/mrezahajilou-ops/stock-data/main/data';
var RAW='https://raw.githubusercontent.com/mrezahajilou-ops/stock-data';
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function big(v){if(v==null||!isFinite(v))return '—';var a=Math.abs(v),s=v<0?'-':'';if(a>=1e12)return s+'$'+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+'$'+(a/1e9).toFixed(1)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(0)+'M';return s+'$'+a.toFixed(0)}
function pct(v,d){if(v==null||!isFinite(v))return '—';if(Math.abs(v)>10)return 'n/m';return (v*100).toFixed(d==null?1:d)+'%'}
function x1(v){return v==null||!isFinite(v)?'—':v.toFixed(1)}
function scol(v){return v>=4?'#4FA37A':v>=3?'#8FB07A':v>=2?'#C9A961':'#C8534F'}
function sc(v){return v==null?'—':'<span class="sc" style="background:'+scol(v)+'">'+(Math.round(v*10)/10)+'</span>'}
/* live quotes */
var RZQ=null,RZQ_P=null,RZQ_ST={'Open':'قیمت لحظه‌ای','Pre Market':'پیش‌بازار','After Hours':'پس از بسته‌شدن بازار','Closed':'قیمت پایانی'};
function liveQuotes(){if(!RZQ_P){var p=fetch(RAW+'/quotes/quotes.json?v='+Math.floor(Date.now()/120000)).then(function(r){return r.ok?r.json():null}).then(function(j){RZQ=j&&j.q?j:null;return RZQ}).catch(function(){return null});
  RZQ_P=Promise.race([p,new Promise(function(res){setTimeout(function(){res(null)},3500)})]);p.then(function(){RZQ_P=Promise.resolve(RZQ)})}return RZQ_P}
function liveWhen(iso){try{var d=new Date(iso);if(isNaN(d))return '';return d.toLocaleString('fa-IR-u-ca-gregory',{timeZone:'America/New_York',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',hour12:false})+' به وقت نیویورک'}catch(e){return ''}}
/* compact screener rows (+ browser cache), rescaled to live prices */
function decodeMin(m){var cols=m.cols,D=m.dict||{},S=m.scale||{},idx=cols.map(function(c){return D[c]?['d',D[c]]:S[c]?['s',S[c]]:null});
  return {cols:cols,as_of:m.as_of,rows:m.rows.map(function(r){return r.map(function(v,i){var x=idx[i];if(!x||v==null)return v;return x[0]==='d'?x[1][v]:v*x[1]})})}}
function loadScreener(){var full=function(){return fetch(API+'/screener.json').then(function(r){return r.json()})};
  return fetch(API+'/meta.json?v='+Math.floor(Date.now()/600000)).then(function(r){return r.json()}).catch(function(){return {}}).then(function(meta){var key=meta&&meta.built||'';
    try{var c=JSON.parse(localStorage.getItem('rzc2_data')||'null');if(c&&key&&c.k===key&&c.m)return decodeMin(c.m)}catch(e){}
    return fetch(API+'/screener.min.json?v='+encodeURIComponent(key)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(m){try{localStorage.removeItem('rzc2_data');if(key)localStorage.setItem('rzc2_data',JSON.stringify({k:key,m:m}))}catch(e){}return decodeMin(m)}).catch(full)}).catch(full)}
var C={},ROWS=[],BY={},SPE={};
function liveRow(r){var I=function(k){return C[k]},Q=RZQ&&RZQ.q[r[I('t')]],p0=r[I('price')];if(!Q||!(Q[0]>0)||!p0)return;var f=Q[0]/p0;
  var o={pe:r[I('pe')],pf:r[I('pfcf')],pg:r[I('peg')],fu:r[I('fair_up')],sv:r[I('s_value')]};
  r[I('price')]=Q[0];r.chg=Q[1];if(r[I('mcap')]!=null)r[I('mcap')]*=f;
  ['pe','pfcf','ps','pb','peg','fwd_pe','fwd_ps','fwd_pfcf'].forEach(function(k){if(I(k)!=null&&r[I(k)]!=null)r[I(k)]*=f});
  ['divy','fcf_yield','shy'].forEach(function(k){if(I(k)!=null&&r[I(k)]!=null)r[I(k)]/=f});
  if(r[I('ev_ebitda')]!=null){var nd=r[I('nd_ebitda')];r[I('ev_ebitda')]=nd!=null?(r[I('ev_ebitda')]-nd)*f+nd:r[I('ev_ebitda')]*f}
  if(r[I('fair_up')]!=null)r[I('fair_up')]=(1+r[I('fair_up')])/f-1;
  if(o.sv!=null){var c4=function(pe,pf,pg,fu){return (pe!=null&&pe<25?1:0)+(pf!=null&&pf<20?1:0)+(fu!=null&&fu>0?1:0)+(pg!=null&&pg<1.5?1:0)},spe=SPE[r[I('sector')]];
    var cs=Math.max(0,Math.min(1,o.sv-c4(o.pe,o.pf,o.pg,o.fu))),pe=r[I('pe')];if(spe!=null&&pe!=null&&o.pe!=null&&((o.pe<spe)!==(pe<spe)))cs=pe<spe?1:0;
    r[I('s_value')]=c4(pe,r[I('pfcf')],r[I('peg')],r[I('fair_up')])+cs;
    var parts=['s_value','s_future','s_past','s_health','s_capital'].map(function(k){return r[I(k)]}).filter(function(x){return x!=null});if(parts.length)r[I('s_total')]=Math.round(parts.reduce(function(a,b){return a+b},0)/parts.length*10)/10}}
function loadAll(){return Promise.all([loadScreener(),liveQuotes(),fetch(API+'/sectors.json').then(function(r){return r.ok?r.json():{}}).catch(function(){return {}})]).then(function(x){
  var j=x[0];j.cols.forEach(function(c,i){C[c]=i});Object.keys(x[2]||{}).forEach(function(k){if(x[2][k]&&x[2][k].pe)SPE[k]=x[2][k].pe});
  ROWS=j.rows;ROWS.forEach(function(r){liveRow(r);BY[r[C.t]]=r});return j})}
function g(r,k){return r&&C[k]!=null?r[C[k]]:null}
/* ticker search box */
function rzRank(L,v,gt,gn,k){var o=[];L.forEach(function(x,i){var t=gt(x),n=String(gn(x)||'').toUpperCase(),s;if(t===v)s=0;else if(t.indexOf(v)===0)s=1;else if(n.indexOf(v)===0||n.indexOf(' '+v)>=0)s=2;else if(n.indexOf(v)>=0)s=3;else return;o.push([s,i,x])});o.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});return o.slice(0,k||10).map(function(a){return a[2]})}
function picker(inp,box,onPick){inp.addEventListener('input',function(){var q=inp.value.trim().toUpperCase();if(!q){box.style.display='none';return}
  var res=rzRank(ROWS,q,function(r){return r[C.t]},function(r){return r[C.n]});
  box.innerHTML=res.map(function(r){return '<div data-t="'+esc(r[C.t])+'"><span>'+esc(r[C.n])+'</span><b>'+esc(r[C.t])+'</b></div>'}).join('');box.style.display=res.length?'block':'none'});
  box.addEventListener('click',function(e){var d=e.target.closest('div[data-t]');if(!d)return;box.style.display='none';inp.value='';onPick(d.dataset.t)});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=inp.value.trim().toUpperCase();if(BY[t]){box.style.display='none';inp.value='';onPick(t)}}})}
/* watchlist storage (this device) */

function day(s){var d=new Date(typeof s==='number'?s*1000:s);if(isNaN(d))return String(s);return FA(d.getDate())+' '+MON[d.getMonth()]+' '+FA(d.getFullYear())}
function when(ts){var d=new Date(ts*1000);if(isNaN(d))return '';var p=function(n){return FA(String(n).padStart(2,'0'))};return day(ts)+'، '+p(d.getHours())+':'+p(d.getMinutes())}

/* ---------- portfolio view (shared by my dashboard and public profile) ---------- */
function holdings(p,mine){
  var pos=p.positions||[],tot=p.cash;pos.forEach(function(x){x.val=x.qty*(x.px||x.cost/x.qty);tot+=x.val});
  var rows=pos.sort(function(a,b){return b.val-a.val}).map(function(x){var avg=x.cost/x.qty,pl=x.val/x.cost-1;
    return '<tr><td><a href="/pages/stock#'+esc(x.t)+'" class="tk">'+esc(x.t)+'</a><small>'+esc(NAMES[x.t]||'')+'</small></td><td>'+N(x.qty,4)+'</td><td class="mh">'+D(avg)+'</td><td class="mh">'+D(x.px)+(x.chg!=null?' <small>'+P(x.chg/100,2)+'</small>':'')+'</td><td>'+D(x.val)+'</td><td class="mh">'+P(x.val/tot,0).replace(/[+]/,'')+'</td><td>'+P(pl)+'</td>'+
      (mine?'<td><button class="lnk" data-sell="'+esc(x.t)+'">فروش</button></td>':'')+'</tr>'}).join('');
  rows+='<tr class="cash"><td>💵 نقد</td><td></td><td class="mh"></td><td class="mh"></td><td>'+D(p.cash)+'</td><td class="mh">'+P(p.cash/tot,0).replace(/[+]/,'')+'</td><td></td>'+(mine?'<td></td>':'')+'</tr>';
  var alloc=pos.map(function(x,i){return '<span style="width:'+(x.val/tot*100).toFixed(2)+'%;background:hsl('+(i*47%360)+',45%,52%)" title="'+esc(x.t)+'"></span>'}).join('')+'<span style="width:'+(p.cash/tot*100).toFixed(2)+'%;background:#556"></span>';
  return '<div class="alloc">'+alloc+'</div><div class="tw"><table class="ht"><thead><tr><th>سهم</th><th>تعداد</th><th class="mh">میانگین خرید</th><th class="mh">قیمت</th><th>ارزش</th><th class="mh">وزن</th><th>سود/زیان</th>'+(mine?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function history(p,mine){
  var O=(p.orders||[]),I=(p.income||[]).filter(function(x){return x.kind==='div'||x.kind==='split'});
  var ST={pending:'در انتظار قیمت بعدی',filled:'انجام شد',cancelled:'لغو شد',rejected:'رد شد'};
  var ev=O.map(function(o){return {ts:o.ts,h:'<div class="tr '+o.side+' '+o.status+'"><div class="l"><b>'+(o.side==='buy'?'خرید':'فروش')+' <a href="/pages/stock#'+esc(o.t)+'" class="tk">'+esc(o.t)+'</a></b> '+
      (o.status==='filled'?N(o.fill_qty,4)+' سهم × '+D(o.price)+' = '+D(o.fill_amt):(o.side==='buy'?D(o.amount):N(o.qty,4)+' سهم'))+
      '<small>'+when(o.status==='filled'?o.fill_ts:o.ts)+' | '+ST[o.status]+(o.status==='rejected'&&o.reason?' ('+esc(o.reason)+')':'')+'</small>'+(o.note?'<q dir="auto">'+esc(o.note)+'</q>':'')+'</div>'+
      (mine&&o.status==='pending'?'<button class="lnk" data-cancel="'+o.id+'">لغو</button>':'')+'</div>'}})
    .concat(I.map(function(x){return {ts:x.ts,h:'<div class="tr inc"><div class="l"><b>'+(x.kind==='div'?'💰 سود نقدی ':'✂️ اسپلیت ')+esc(x.t)+'</b> '+(x.kind==='div'?D(x.amount):'')+'<small>'+when(x.ts)+'</small></div></div>'}}))
    .sort(function(a,b){return b.ts-a.ts});
  return ev.length?ev.map(function(e){return e.h}).join(''):'<p class="note">هنوز تریدی ثبت نشده.</p>'}
function summary(p,value){var r=value/10000-1;
  return '<div class="sum"><div><small>ارزش پورتفو</small><b>'+D(value)+'</b></div><div><small>بازده کل</small><b>'+P(r)+'</b></div><div><small>نقد</small><b>'+D(p.cash)+'</b></div><div><small>سهم‌ها</small><b>'+FA((p.positions||[]).length)+'</b></div><div><small>تریدها</small><b>'+FA((p.orders||[]).filter(function(o){return o.status==='filled'}).length)+'</b></div></div>'}
function chart(id,box){api('/hist/'+id).then(function(j){if(!j.v||j.v.length<2){$(box).innerHTML='<p class="note">نمودار از فردای ساخت پروفایل نمایش داده می‌شه.</p>';return}
  var V=j.v,W=600,H=150,mn=Math.min.apply(null,V.map(function(x){return x[1]}).concat([10000])),mx=Math.max.apply(null,V.map(function(x){return x[1]}).concat([10000]));if(mx===mn)mx=mn+1;
  var X=function(i){return 10+i/(V.length-1)*(W-20)},Y=function(v){return H-10-(v-mn)/(mx-mn)*(H-30)};
  var pts=V.map(function(x,i){return X(i).toFixed(1)+','+Y(x[1]).toFixed(1)}).join(' '),last=V[V.length-1][1],col=last>=10000?'var(--up)':'var(--dn)';
  $(box).innerHTML='<svg viewBox="0 0 '+W+' '+H+'" class="ch"><line x1="10" x2="'+(W-10)+'" y1="'+Y(10000)+'" y2="'+Y(10000)+'" class="base"/><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.5"/></svg>'+
    '<div class="chl"><span><bdi dir="ltr">'+esc(V[0][0])+'</bdi></span><span>خط‌چین = <bdi dir="ltr">$10,000</bdi></span><span><bdi dir="ltr">'+esc(V[V.length-1][0])+'</bdi></span></div>'}).catch(function(){})}

/* ---------- my dashboard ---------- */
var CUR=0;
function me(){
  if(!LOGGED||!TOK){main(bar('me')+'<div class="card center"><h2>ورود به مسابقه</h2><p>با ایمیلت وارد شو تا پروفایل و داشبوردت رو ببینی. اگه هنوز پروفایل نداری، بعد از ورود می‌سازیش.</p><a class="btn" href="'+LOGIN+'">ورود با ایمیل</a></div>');return}
  main(bar('me')+'<div class="card empty">در حال بارگذاری…</div>');
  api('/me').then(function(j){
    if(j._s===401){main(bar('me')+'<div class="card center"><p>نشست منقضی شده؛ صفحه رو دوباره باز کن.</p><a class="btn" href="'+LOGIN+'">ورود دوباره</a></div>');return}
    ME=j;if(!j.profiles||!j.profiles.length){location.hash='#/new';return}
    if(!j.profiles.some(function(p){return p.id===CUR}))CUR=j.profiles[j.profiles.length-1].id;
    var p=j.profiles.filter(function(x){return x.id===CUR})[0];
    var tabs=j.profiles.length>1?'<div class="sorts">'+j.profiles.map(function(x){return '<button data-p="'+x.id+'" class="'+(x.id===CUR?'on':'')+'">'+esc(x.name)+'</button>'}).join('')+'</div>':'';
    main(bar('me')+tabs+'<div class="card"><div class="phead"><div><h2>'+esc(p.name)+'</h2>'+(p.strategy?'<p class="strat">'+esc(p.strategy)+'</p>':'')+'<small>از '+day(p.created)+' | <a href="#/p/'+p.id+'">صفحه‌ی عمومی</a> | <a href="#/rules">قوانین</a></small></div></div>'+summary(p,p.value)+
      ((p.positions||[]).length<3?'<p class="warn">برای حضور در رده‌بندی حداقل ۳ سهم لازمه (الان '+FA((p.positions||[]).length)+').</p>':'')+'<div id="rzc-ch"></div></div>'+
      '<div class="card" id="rzc-trade"><h3>خرید و فروش</h3>'+tradeForm(p)+'</div>'+
      '<div class="card"><h3>دارایی‌ها</h3>'+holdings(p,true)+'</div><div class="card"><h3>تاریخچه‌ی تریدها</h3>'+history(p,true)+'</div>'+
      (j.can_new?'':'<p class="note">پروفایل جدید بعدی از '+day(j.next_new)+'.</p>'));
    chart(p.id,'rzc-ch');bindTrade(p);
    document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){CUR=+b.getAttribute('data-p');me()}});
    document.querySelectorAll('[data-cancel]').forEach(function(b){b.onclick=function(){b.disabled=true;api('/cancel',{method:'POST',body:{pid:p.id,oid:+b.getAttribute('data-cancel')}}).then(me)}});
    document.querySelectorAll('[data-sell]').forEach(function(b){b.onclick=function(){setSide('sell',b.getAttribute('data-sell'));$('rzc-trade').scrollIntoView({behavior:'smooth'})}});
  }).catch(function(){main(bar('me')+'<div class="card empty">ارتباط با سرور برقرار نشد؛ چند لحظه بعد دوباره امتحان کن.</div>')})}
function tradeForm(p){
  var held=(p.positions||[]).map(function(x){return '<option value="'+esc(x.t)+'">'+esc(x.t)+' ('+Number(x.qty).toLocaleString('en-US',{maximumFractionDigits:4})+')</option>'}).join('');
  return '<div class="side"><button data-side="buy" class="on">خرید</button><button data-side="sell">فروش</button></div>'+
    '<div id="rzc-buy"><label>نماد<div class="pick"><input id="rzc-t" placeholder="نماد یا اسم شرکت، مثلاً AAPL یا GLD" autocomplete="off" dir="ltr"><div class="sugg" id="rzc-sg"></div></div></label>'+
    '<label>مبلغ (دلار) <small>نقد در دسترس: '+D(p.cash)+'</small><input id="rzc-amt" inputmode="decimal" dir="ltr" placeholder="1000"></label><div class="quick" id="rzc-quick"></div></div>'+
    '<div id="rzc-sell" hidden><label>کدوم سهم؟<select id="rzc-st">'+held+'</select></label><label>تعداد سهم<input id="rzc-q" inputmode="decimal" dir="ltr"></label><div class="quick"><button data-frac="0.25">۲۵٪</button><button data-frac="0.5">۵۰٪</button><button data-frac="1">همه</button></div></div>'+
    '<label>چرا؟ (اختیاری، فارسی یا انگلیسی، تا ۵۰۰ حرف)<textarea id="rzc-note" maxlength="500" rows="2" dir="auto"></textarea></label>'+
    '<div class="est" id="rzc-est"></div><button class="btn" id="rzc-send">ثبت سفارش</button><p class="err" id="rzc-err"></p>'+
    '<p class="note">سفارش با <b>اولین قیمتی که بعد از ثبت منتشر می‌شه</b> انجام می‌شه (معمولاً تا ۱۵ دقیقه در ساعت بازار؛ اگه بازار بسته‌ست، شروع روز معاملاتی بعد).</p>'}
var SIDE='buy';
function setSide(s,t){SIDE=s;document.querySelectorAll('[data-side]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-side')===s)});$('rzc-buy').hidden=s!=='buy';$('rzc-sell').hidden=s!=='sell';if(t&&$('rzc-st'))$('rzc-st').value=t;est()}
function est(){var box=$('rzc-est');if(!box)return;var Q=RZQ&&RZQ.q||{};
  if(SIDE==='buy'){var t=$('rzc-t').value.trim().toUpperCase(),a=parseFloat($('rzc-amt').value),q=Q[t];box.innerHTML=q&&a>0?'قیمت فعلی '+D(q[0])+' ← حدود '+N(a/q[0],4)+' سهم':(t&&!q&&t.length>0?'':'');}
  else{var s=$('rzc-st').value,n=parseFloat($('rzc-q').value),qq=Q[s];box.innerHTML=qq&&n>0?'قیمت فعلی '+D(qq[0])+' ← حدود '+D(n*qq[0]):''}}
function bindTrade(p){
  document.querySelectorAll('[data-side]').forEach(function(b){b.onclick=function(){setSide(b.getAttribute('data-side'))}});
  var inp=$('rzc-t'),box=$('rzc-sg');
  inp.addEventListener('input',function(){var q=inp.value.trim().toUpperCase();est();if(!q||!UNI){box.style.display='none';return}
    var res=rzRank(UNI,q,function(t){return t},function(t){return NAMES[t]||''}).slice(0,8);
    box.innerHTML=res.map(function(t){return '<div data-t="'+esc(t)+'"><span>'+esc(NAMES[t]||'')+'</span><b>'+esc(t)+'</b></div>'}).join('');box.style.display=res.length?'block':'none'});
  box.addEventListener('mousedown',function(e){var d=e.target.closest('[data-t]');if(!d)return;e.preventDefault();inp.value=d.getAttribute('data-t');box.style.display='none';est()});
  inp.addEventListener('blur',function(){setTimeout(function(){box.style.display='none'},150)});
  $('rzc-amt').addEventListener('input',est);$('rzc-q').addEventListener('input',est);$('rzc-st').addEventListener('change',est);
  $('rzc-quick').innerHTML=[0.1,0.25,0.5].map(function(f){return '<button data-amt="'+Math.floor(p.value*f)+'">'+FA(f*100)+'٪ پورتفو</button>'}).join('')+'<button data-amt="'+Math.floor(p.cash*100)/100+'">همه‌ی نقد</button>';
  document.querySelectorAll('[data-amt]').forEach(function(b){b.onclick=function(){$('rzc-amt').value=b.getAttribute('data-amt');est()}});
  document.querySelectorAll('[data-frac]').forEach(function(b){b.onclick=function(){var t=$('rzc-st').value,x=(p.positions||[]).filter(function(y){return y.t===t})[0];if(!x)return;var f=+b.getAttribute('data-frac');$('rzc-q').value=f===1?'all':(Math.floor(x.qty*f*10000)/10000);est()}});
  $('rzc-send').onclick=function(){var b=this,body={pid:p.id,side:SIDE,note:$('rzc-note').value};
    if(SIDE==='buy'){body.t=$('rzc-t').value.trim().toUpperCase();body.amount=parseFloat(String($('rzc-amt').value).replace(/,/g,''))}else{body.t=$('rzc-st').value;var q=$('rzc-q').value.trim();body.qty=q==='all'?'all':parseFloat(q)}
    b.disabled=true;$('rzc-err').textContent='';
    api('/order',{method:'POST',body:body}).then(function(j){b.disabled=false;if(j.ok){BOARD=null;me()}else $('rzc-err').innerHTML=esc(j.error||'خطا')+(j.max!=null?' (حداکثر حدود '+D(j.max,0)+')':'')+(j.cash!=null?' (در دسترس: '+D(j.cash)+')':'')})
      .catch(function(){b.disabled=false;$('rzc-err').textContent='ارتباط برقرار نشد'})}}

/* ---------- public profile ---------- */
function prof(id){
  main(bar('')+'<div class="card empty">در حال بارگذاری…</div>');
  api('/p/'+id).then(function(p){
    if(p._s!==200){main(bar('')+'<div class="card empty">این پروفایل پیدا نشد.</div>');return}
    var h=bar('')+'<div class="card"><div class="phead"><div><h2>'+esc(p.name)+'</h2>'+(p.strategy?'<p class="strat">'+esc(p.strategy)+'</p>':'')+'<small>از '+day(p.created)+'</small></div></div>'+
      '<div class="sum"><div><small>ارزش پورتفو</small><b>'+D(p.value)+'</b></div><div><small>بازده کل</small><b>'+P(p.value/10000-1)+'</b></div><div><small>سهم‌ها</small><b>'+FA(p.n_pos)+'</b></div><div><small>تریدها</small><b>'+FA(p.n_trades)+'</b></div></div>';
    if(p.locked){
      h+='<div class="lock">🔒 '+(p.unlock==='feb'?'برای عادلانه بودن مسابقه، سهم‌ها و تریدهای پروفایل‌ها تا <b>۱ فوریه ۲۰۲۷</b> نمایش داده نمی‌شه. از اون تاریخ برای مشترکین Stock Pro باز می‌شه.':
        'سهم‌ها، تریدها و کامنت‌های این پورتفو مخصوص مشترکین Stock Pro است.<div class="btns"><a class="btn" href="/products/stock-data-pro">اشتراک ماهانه <bdi dir="ltr">€7.99</bdi></a><a class="btn alt" href="/products/stock-data-pro-yearly">سالانه <bdi dir="ltr">€47.94</bdi></a></div>')+'</div></div>';
      main(h);return}
    h+='<div id="rzc-ch"></div></div><div class="card"><h3>دارایی‌ها</h3>'+holdings(p,false)+'</div><div class="card"><h3>تاریخچه‌ی تریدها</h3>'+history(p,false)+'</div>';
    if(ME&&ME.me&&ME.me.admin)h+='<p class="note">مدیر: <button class="lnk" id="rzc-hide">مخفی کردن این پروفایل</button></p>';
    main(h);chart(p.id,'rzc-ch');var hb=$('rzc-hide');if(hb)hb.onclick=function(){api('/admin',{method:'POST',body:{pid:p.id,status:'hidden'}}).then(function(){BOARD=null;location.hash='#/'})};
  })}

/* ---------- router ---------- */
function route(){var h=location.hash.replace(/^#/,'')||'/';window.scrollTo(0,0);
  if(h==='/me')me();else if(h==='/new')create();else if(h==='/rules')rules();else if(/^\/p\/\d+$/.test(h))prof(+h.split('/')[2]);else board()}
window.addEventListener('hashchange',route);
Promise.all([fetch(RAW+'/contest-data/universe.json?v='+Math.floor(Date.now()/3600000)).then(function(r){return r.ok?r.json():null}).catch(function(){return null}),liveQuotes(),loadAll().catch(function(){})]).then(function(x){
  var U=x[0];if(U){UNI=U.t;Object.keys(U.etf||{}).forEach(function(t){NAMES[t]=U.etf[t]+' (ETF)'})}
  (ROWS||[]).forEach(function(r){if(!NAMES[r[C.t]])NAMES[r[C.t]]=r[C.n]});
  if(TOK&&!ME)api('/me').then(function(j){if(j&&j.profiles)ME=j}).catch(function(){});
});
route();

})();
</script>
</div>
