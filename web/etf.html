/* ============================================================================
   rezahajiloubooks.com — shared visual identity for every tool page.
   Appended after each page's own CSS (gen_web.py), so it only needs to (1) redefine the colour tokens the
   pages already use, (2) restyle the few structural pieces that carried the old look: nav pills, filled
   header bands, bordered cards, 900-weight headings, lime buttons.  #rzf is replaced per page.
   Direction: a private study — near-black warm ground, antique-gold accent used sparingly, serif numerals.
   ============================================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

#rzf{
  --bg:#0C0E12;        /* page ground */
  --card:#15181F;      /* raised surface */
  --card2:#1C2029;     /* second level (tiles inside cards) */
  --line:#262B36;      /* hairlines; used far less than before */
  --ink:#E8E4DA;       /* primary text: warm paper */
  --mut:#8A8F99;       /* secondary text */
  --ac:#C9A961;        /* the one accent: antique gold */
  --lime:#C9A961;      /* legacy token name -> gold, so old "active" states pick up the accent */
  --gold:#C9A961;
  --red:#C8534F;       /* loss */
  --up:#4FA37A;        /* gain */
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  background:var(--bg);color:var(--ink);border-radius:0;padding:18px 22px 48px;line-height:1.75;
  font-feature-settings:'tnum' 1,'lnum' 1;
}
#rzf *{font-family:inherit}
#rzf a{color:var(--ac);text-decoration-color:rgba(201,169,97,.5)}
#rzf a:hover{color:var(--ink)}

/* ---------- navigation: a quiet text row, gold underline on the current page ---------- */
#rzf .nav{gap:2px 22px;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:0}
#rzf .nav a{padding:10px 2px 12px;border:0;border-radius:0;background:none;color:var(--mut)!important;font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
#rzf .nav a:hover{color:var(--ink)!important}
#rzf .nav a.on{background:none;color:var(--ink)!important;border-bottom-color:var(--ac)}

/* ---------- type ---------- */
#rzf h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px;font-variation-settings:'opsz' 72}
#rzf .sub{font-size:14px;color:var(--mut);max-width:72ch;margin-bottom:18px}
#rzf h3{font-weight:600;font-size:15.5px;color:var(--ink);letter-spacing:0}
#rzf b,#rzf strong{font-weight:600}
#rzf .co,#rzf .rzd .co{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
#rzf .co small{color:var(--ac);font-family:'Vazirmatn',sans-serif;font-weight:500}
#rzf .px .p,#rzf .sc .v,#rzf .vbig b,#rzf .rev .bx .big,#rzf .snap b,#rzf .stats b,#rzf .st .v{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-variation-settings:'opsz' 36}
#rzf .px .p{font-size:30px}
#rzf .st .v{font-size:19px}

/* ---------- surfaces: tone instead of borders ---------- */
#rzf .card{background:var(--card);border:0;border-radius:14px;padding:16px 18px;margin-bottom:12px}
#rzf .card .card{background:var(--card2)}
#rzf .st,#rzf .snap div,#rzf .vbig div,#rzf .ist4 div,#rzf .ab-grid>div,#rzf .vcol,#rzf .sc,#rzf .rev .bx,#rzf .perf div,#rzf .relc,#rzf .stats div{background:var(--card2);border:0}
#rzf .relc:hover{border:0;box-shadow:inset 0 0 0 1px var(--ac);transform:none}
#rzf .wide2 .card,#rzf .charts .card,#rzf .two .card{background:var(--card)}
#rzf .tblwrap,#rzf .tw{border:0;border-radius:10px}
#rzf .charts .card{cursor:zoom-in}

/* ---------- table heads: hairline, no filled band ---------- */
#rzf .tbl th,#rzf th,#rzf .proj th,#rzf .sens th,#rzf .antbl th,#rzf table.itb th{background:transparent;color:var(--mut);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--ac);padding:8px 8px}
#rzf .tbl th.grp{border-bottom:0;color:var(--mut)}
#rzf td{border-bottom:1px solid #1A1E26}
#rzf .tbl td.sep{border-left-color:var(--line)}
#rzf tr.sec td,#rzf .sec td{color:var(--ac);font-weight:600;background:transparent}
#rzf th.ttm,#rzf td.ttm{background:rgba(201,169,97,.07);color:var(--ink)}
#rzf th.ttm{color:var(--ac)}

/* ---------- buttons, chips, inputs ---------- */
#rzf .btn{background:var(--ac);color:#15120A!important;font-weight:600;border-radius:10px;padding:9px 18px}
#rzf .btn.ghost{background:transparent;color:var(--ink)!important;border:1px solid var(--line)}
#rzf .btn.ghost:hover{border-color:var(--ac)}
#rzf .lnk{color:var(--ac)}
#rzf .chip,#rzf .rng button,#rzf .tabs button{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500;border-radius:999px}
#rzf .chip:hover,#rzf .rng button:hover{border-color:var(--ac);color:var(--ink)}
#rzf .rng button.on,#rzf .tabs button.on,#rzf .chip.on{background:transparent;border-color:var(--ac);color:var(--ac);font-weight:600}
#rzf input,#rzf select,#rzf .pin,#rzf .tbl input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-weight:500}
#rzf input:focus,#rzf select:focus,#rzf .tbl input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(201,169,97,.15)}
#rzf .search input{font-size:17px;padding:12px 16px}
#rzf .sugg{background:var(--card2);border:1px solid var(--line)}
#rzf .card:has(.sugg){overflow:visible}  /* the shop theme clips .card (overflow:hidden); search suggestions must hang out of the card */
#rzf .sugg{max-height:min(430px,62vh)!important}
#rzf .sugg div:hover{background:#242934}
#rzf .badge{background:rgba(201,169,97,.12);color:var(--ac)}
#rzf .vtag{font-weight:600;border-radius:8px}

/* ---------- semantic colours: muted gain / loss; gold is never "good", it is "important" ---------- */
#rzf .up{color:var(--up)}#rzf .dn{color:var(--red)}
#rzf .vrow.ok b{background:var(--up)}#rzf .vrow.no b{background:var(--red)}
#rzf .vrow.ok em{color:var(--up)}#rzf .vrow.no em{color:var(--red)}
#rzf .good{background:rgba(79,163,122,.16);color:var(--up)}
#rzf .bad{background:rgba(200,83,79,.16);color:#E2807C}
#rzf .mid{background:rgba(201,169,97,.14);color:var(--ac)}
#rzf .vsum .up{color:var(--up)}

/* ---------- quieter secondary text, no 900 weights left ---------- */
#rzf .meta,#rzf .xnote,#rzf .note,#rzf .mut2,#rzf .st .k,#rzf .st .s{color:var(--mut);font-weight:400}
#rzf .stats small,#rzf .snap small,#rzf .vbig small{font-weight:500}
#rzf .quota{color:var(--mut)}
#rzf .tk{color:var(--ac);font-weight:600}
#rzf .sc{color:#15120A;font-weight:600}

/* ---------- the one motion: hero fades in on first paint ---------- */
@media (prefers-reduced-motion:no-preference){
  #rzf .card:first-of-type .head{animation:rz-in .45s ease-out both}
  @keyframes rz-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
#rzf :focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- phones: nav becomes one scrollable row; smaller display sizes ---------- */
@media (max-width:760px){
  #rzf{padding:12px 14px 40px}
  #rzf .nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0 18px;scrollbar-width:none;margin-bottom:14px;padding-bottom:0}
  #rzf .nav::-webkit-scrollbar{display:none}
  #rzf .nav{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}  /* hint: the row scrolls */
  #rzf .nav a{white-space:nowrap;font-size:13.5px;padding:8px 2px 10px;flex:none}
  #rzf h1{font-size:23px}
  #rzf .sub{font-size:13.5px;margin-bottom:12px}
  #rzf .co{font-size:21px}
  #rzf .px .p{font-size:26px}
  #rzf .card{padding:14px;border-radius:12px}
  #rzf .search input{font-size:16px;padding:11px 14px}
}

/* subscriber login / account button (the theme header is off, so this is the only way in) */
#rzf .acctbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#rzf .acctbar .qk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink)!important;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none!important;white-space:nowrap}
#rzf .acctbar .qk:hover{border-color:var(--gold);color:var(--gold)!important}
#rzf .acctbar .qcont{border-color:rgba(201,169,97,.6);color:var(--gold)!important}
#rzf .acctbar .acct{margin-inline-start:auto}
@media(max-width:420px){#rzf .acctbar{gap:5px}#rzf .acctbar .qk,#rzf .acctbar .acct{font-size:12px;padding:4px 9px}}
@media(max-width:360px){#rzf .acctbar{gap:4px}#rzf .acctbar .qk,#rzf .acctbar .acct{font-size:11px;padding:3px 7px}}
#rzf .acct{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:#15120a!important;background:var(--gold);border-radius:999px;padding:5px 14px;text-decoration:none!important}
#rzf .acct.in{background:transparent;color:var(--gold)!important;border:1px solid var(--gold)}

/* Quick keys: the sticky bar on long pages (stock pages, the stock analysis tool, ETF pages).
   Four keys jump to the parts people look for, the one in view lights up, and a house and a magnifier
   take you home or to another stock from anywhere on the page. Language-free: every word on it is
   in the markup, so the same code serves all five sites.

   <nav class="qkb" data-ph="Search any stock" data-none="No match" data-idx="/assets/search.json"
        data-url="/stocks/{l}/">
     <a class="qkb-i qkb-home" href="/" aria-label="Home">…</a>
     <div class="qkb-k"><a href="#s-ov">Overview</a> … </div>
     <button class="qkb-i qkb-find" type="button" aria-label="Search">…</button>
   </nav>

   data-idx: a JSON list [{t, n, u?}] fetched the first time the search opens. Instead, a page can
   set window.QK_INDEX = function () { return [...] } (the analysis tool already holds its list).
   data-url: where a result goes; {t} = ticker, {l} = ticker in lower case. data-hash="1" makes a
   result set location.hash instead (the analysis tool reads the ticker from the hash).
   The keys never change location.hash, which the analysis tool uses for the ticker. */
(function () {
  function $$(r, s) { return [].slice.call(r.querySelectorAll(s)) }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

  function QK(nav) {
    if (!nav || nav.__qk) return;
    nav.__qk = 1;
    var keys = $$(nav, '.qkb-k a'), row = nav.querySelector('.qkb-k'), off = 0, ticking = false, cur = -1;

    // a header the host page keeps fixed at the top (the Shopify theme) pushes the bar down
    function hostTop() {
      var o = 0, els = document.elementsFromPoint ? document.elementsFromPoint(innerWidth / 2, 1) : [];
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (nav.contains(el) || el === document.body || el === document.documentElement) continue;
        for (var n = el; n && n !== document.body; n = n.parentElement) {
          if (nav.contains(n)) break;
          var p = getComputedStyle(n).position;
          if (p === 'fixed' || p === 'sticky') {
            var r = n.getBoundingClientRect();
            if (r.top <= 1 && r.bottom > 0 && r.height < innerHeight / 3) o = Math.max(o, r.bottom);
            break;
          }
        }
      }
      return Math.round(o);
    }
    function inpage(a) { return (a.getAttribute('href') || '').charAt(0) === '#' }
    function target(a) {
      if (!inpage(a)) return null;
      var el = document.getElementById(a.getAttribute('href').slice(1));
      return el && el.offsetParent !== null ? el : null;     // hidden (display:none) parts of the page are skipped
    }
    function update() {
      ticking = false;
      if (!nav.isConnected) {            // the analysis tool redraws its page for each stock: drop the old bar
        removeEventListener('scroll', tick); removeEventListener('resize', tick); return;
      }
      var o = hostTop();
      if (o !== off) { off = o; nav.style.top = off + 'px' }
      var nr = nav.getBoundingClientRect();
      nav.classList.toggle('stuck', nr.top <= off + 0.5 && (window.scrollY || 0) > 40);
      var line = nr.bottom + 24, act = -1;
      keys.forEach(function (a, i) {
        if (!inpage(a)) return;          // a key to another page is always available and never 'in view'
        var t = target(a);
        a.classList.toggle('off', !t);
        if (t && t.getBoundingClientRect().top <= line) act = i;
      });
      if (act < 0 && keys.length) act = 0;
      if (act !== cur) {
        cur = act;
        keys.forEach(function (a, i) { a.classList.toggle('on', i === act); if (i === act) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current') });
        var a = keys[act];
        if (a && row.scrollWidth > row.clientWidth + 2) {
          var l = a.offsetLeft - row.offsetLeft, rr = l + a.offsetWidth;
          if (l < row.scrollLeft || rr > row.scrollLeft + row.clientWidth) row.scrollTo({ left: l - 12, behavior: 'smooth' });
        }
      }
    }
    function tick() { if (!ticking) { ticking = true; requestAnimationFrame(update) } }
    addEventListener('scroll', tick, { passive: true });
    addEventListener('resize', tick);
    keys.forEach(function (a) {
      a.addEventListener('click', function (ev) {
        if (!inpage(a)) return;
        ev.preventDefault();
        var t = target(a);
        if (!t) return;
        close();
        var y = t.getBoundingClientRect().top + (window.scrollY || 0) - nav.offsetHeight - off - 10;
        // a short hop glides; a long one (several screens) jumps, so nobody waits for the page to roll past
        var far = Math.abs(y - (window.scrollY || 0)) > innerHeight * 3;
        window.scrollTo({ top: Math.max(0, y), behavior: far ? 'auto' : 'smooth' });
      });
    });

    /* ---- search ---- */
    var find = nav.querySelector('.qkb-find'), box, inp, res, list = null, loading = null, sel = 0, hits = [];
    function load() {
      if (list) return Promise.resolve(list);
      if (typeof window.QK_INDEX === 'function') { var l = window.QK_INDEX(); if (l && l.length) { list = l; return Promise.resolve(list) } }
      if (!loading) loading = fetch(nav.getAttribute('data-idx')).then(function (r) { return r.json() }).then(function (j) { list = j; return j }).catch(function () { loading = null; return [] });
      return loading;
    }
    function url(x) {
      if (x.u) return x.u;
      var p = nav.getAttribute('data-url') || '/stocks/{l}/';
      return p.replace('{t}', x.t).replace('{l}', x.t.toLowerCase());
    }
    // Arabic and Persian spellings vary (alef with or without hamza, Arabic or Persian yeh and kaf, teh marbuta):
    // compare a folded form. Written as \u escapes so this file stays free of right-to-left script.
    function fold(s) {
      return String(s || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')
        .replace(/[\u0649\u064A\u06CC]/g, '\u06CC').replace(/[\u0643\u06A9]/g, '\u06A9').replace(/\u0629/g, '\u0647').replace(/\u0624/g, '\u0648').replace(/\u0626/g, '\u06CC');
    }
    function match(q) {
      q = q.trim();
      if (!q || !list) return [];
      var Q = q.toUpperCase(), lq = fold(q), out = [[], [], [], [], []];
      for (var i = 0; i < list.length; i++) {
        var x = list[i], t = (x.t || '').toUpperCase(), n = x.f || (x.f = fold(x.n)), k;
        if (t === Q) k = 0;
        else if (t.indexOf(Q) === 0) k = 1;
        else if (n.indexOf(lq) === 0) k = 2;
        else if (n.indexOf(' ' + lq) >= 0) k = 3;
        else if (lq.length > 1 && n.indexOf(lq) >= 0) k = 4;
        else continue;
        if (out[k].length < 8) out[k].push(x);
      }
      return out[0].concat(out[1], out[2], out[3], out[4]).slice(0, 8);
    }
    function draw() {
      hits = match(inp.value);
      sel = 0;
      if (!inp.value.trim()) { res.innerHTML = ''; return }
      if (!list) { res.innerHTML = '<p class="qkb-m">…</p>'; return }
      res.innerHTML = hits.length ? hits.map(function (x, i) {
        return '<a href="' + esc(url(x)) + '" data-i="' + i + '"' + (i === 0 ? ' class="sel"' : '') + '><b dir="ltr">' + esc(x.t) + '</b><span dir="auto">' + esc(x.n || '') + '</span></a>';
      }).join('') : '<p class="qkb-m">' + esc(nav.getAttribute('data-none') || '—') + '</p>';
    }
    function go(x) {
      if (!x) return;
      if (nav.getAttribute('data-hash') && !x.u) {
        close();
        location.hash = '#' + x.t;
        window.scrollTo({ top: 0 });
        return;
      }
      location.href = url(x);
    }
    function open() {
      if (!box) {
        box = document.createElement('div');
        box.className = 'qkb-s';
        box.innerHTML = '<div class="qkb-sf"><input type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" dir="auto">' +
          '<button type="button" class="qkb-x" aria-label="×">✕</button></div><div class="qkb-r"></div>';
        nav.appendChild(box);
        inp = box.querySelector('input'); res = box.querySelector('.qkb-r');
        inp.placeholder = nav.getAttribute('data-ph') || '';
        inp.addEventListener('input', function () { load().then(draw) });
        inp.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') { close(); find.focus() }
          else if (ev.key === 'Enter') { ev.preventDefault(); go(hits[sel] || hits[0]) }
          else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
            ev.preventDefault();
            if (!hits.length) return;
            sel = (sel + (ev.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
            $$(res, 'a').forEach(function (a, i) { a.classList.toggle('sel', i === sel) });
          }
        });
        res.addEventListener('click', function (ev) {
          var a = ev.target.closest('a[data-i]');
          if (!a || !nav.getAttribute('data-hash')) return;
          ev.preventDefault(); go(hits[+a.getAttribute('data-i')]);
        });
        box.querySelector('.qkb-x').addEventListener('click', close);
      }
      nav.classList.add('open');
      find.setAttribute('aria-expanded', 'true');
      inp.value = ''; res.innerHTML = '';
      inp.focus();
      load();
    }
    function close() {
      if (!nav.classList.contains('open')) return;
      nav.classList.remove('open');
      find && find.setAttribute('aria-expanded', 'false');
      if (inp) inp.blur();
    }
    if (find) {
      find.setAttribute('aria-expanded', 'false');
      find.addEventListener('click', function () { nav.classList.contains('open') ? close() : open() });
      document.addEventListener('click', function (ev) { if (!nav.contains(ev.target)) close() });
    }
    update();
    setTimeout(update, 600);
  }
  window.QK = QK;
  function boot() { $$(document, 'nav.qkb').forEach(QK) }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
/* ETF pages: the return ranking (switch period, show all), the fund finder (search + sort), the long
   intro and the holdings list (show all). Shared by all five editions: etf_pages.py puts it on each page;
   the Persian loader (etf.js) calls ETFM(box) after it drops a fragment in. Safe to run more than once. */
(function () {
  function $$(r, s) { return [].slice.call(r.querySelectorAll(s)) }
  function ETFM(root) {
    root = root || document;
    $$(root, '.sa-etf').forEach(function (art) {
      if (art.__etfm) return;
      art.__etfm = 1;

      // return ranking: period buttons re-order the list and redraw the bars
      $$(art, '.erk').forEach(function (box) {
        var ol = box.querySelector('ol.erk-l'), more = box.querySelector('.erk-more');
        function draw(k) {
          var li = $$(ol, 'li'), mx = 0;
          li.forEach(function (x) { var v = parseFloat(x.getAttribute('data-' + k)); if (isFinite(v)) mx = Math.max(mx, Math.abs(v)) });
          li.sort(function (a, b) {
            var va = parseFloat(a.getAttribute('data-' + k)), vb = parseFloat(b.getAttribute('data-' + k));
            return (isFinite(vb) ? vb : -9) - (isFinite(va) ? va : -9);
          });
          li.forEach(function (x, i) {
            var v = parseFloat(x.getAttribute('data-' + k)), bar = x.querySelector('.erk-b i');
            x.querySelector('.erk-n').textContent = i + 1;
            x.querySelector('em').innerHTML = x.getAttribute('data-' + k + 'f') || '—';
            bar.style.width = (isFinite(v) && mx ? Math.max(2, Math.abs(v) / mx * 100) : 0) + '%';
            bar.className = isFinite(v) && v < 0 ? 'n' : '';
            ol.appendChild(x);
          });
        }
        $$(box, '.erk-p button').forEach(function (b) {
          b.addEventListener('click', function () {
            $$(box, '.erk-p button').forEach(function (o) { o.classList.toggle('on', o === b); o.setAttribute('aria-pressed', o === b) });
            draw(b.getAttribute('data-p'));
          });
        });
        if (more) more.addEventListener('click', function () {
          var cut = ol.classList.toggle('cut');
          more.textContent = more.getAttribute(cut ? 'data-all' : 'data-less');
          if (cut) box.scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
      });

      // fund finder: type to filter, buttons to sort
      $$(art, '.etfbox').forEach(function (box) {
        var tb = box.querySelector('.etftbl tbody'), q = box.querySelector('input.etfq'), cnt = box.querySelector('.etfcnt'), none = box.querySelector('.etfnone');
        if (!tb) return;
        var rows = $$(tb, 'tr');
        function filter() {
          var s = (q && q.value || '').trim().toLowerCase(), n = 0;
          rows.forEach(function (r) {
            var hit = !s || (r.getAttribute('data-s') || '').indexOf(s) >= 0;
            if (hit) { r.removeAttribute('hidden'); n++ } else r.setAttribute('hidden', '');
          });
          if (cnt) cnt.textContent = (cnt.getAttribute('data-f') || '%n').replace('%n', n);
          if (none) none.hidden = n > 0;
        }
        if (q) {
          q.addEventListener('input', filter);
          q.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') {
              var first = rows.filter(function (r) { return !r.hasAttribute('hidden') });
              if (first.length === 1) { var a = first[0].querySelector('a'); if (a) location.href = a.getAttribute('href') }
              q.blur();
            }
          });
        }
        $$(box, '.etfsort button').forEach(function (b) {
          b.addEventListener('click', function () {
            var k = b.getAttribute('data-k'), asc = k === 'k' || k === 'pe';
            $$(box, '.etfsort button').forEach(function (o) { o.classList.toggle('on', o === b); o.setAttribute('aria-pressed', o === b) });
            rows.sort(function (a, c) {
              var va = parseFloat(a.getAttribute('data-' + k)), vc = parseFloat(c.getAttribute('data-' + k));
              var fa = isFinite(va), fc = isFinite(vc);
              if (!fa || !fc) return fa ? -1 : fc ? 1 : 0;        // a fund without the number goes last
              return asc ? va - vc : vc - va;
            });
            rows.forEach(function (r) { tb.appendChild(r) });
          });
        });
      });

      // long intro: three lines and a 'read more' on phones
      $$(art, '.etfintro').forEach(function (p) {
        var b = p.nextElementSibling;
        if (!b || !b.classList.contains('etfmore')) return;
        if (innerWidth > 700 || p.scrollHeight <= p.clientHeight + 4) { p.classList.remove('clip'); b.remove(); return }
        b.hidden = false;
        b.addEventListener('click', function () {
          var c = p.classList.toggle('clip');
          b.textContent = b.getAttribute(c ? 'data-more' : 'data-less');
        });
      });

      // holdings: the first ten, then all
      $$(art, '.hold-more').forEach(function (b) {
        var t = b.parentNode.querySelector('table.hold');
        if (!t) return;
        b.addEventListener('click', function () {
          var cut = t.classList.toggle('cut');
          b.textContent = b.getAttribute(cut ? 'data-all' : 'data-less');
        });
      });
    });
  }
  window.ETFM = ETFM;
