/* ============================================================================
   rezahajiloubooks.com — shared visual identity for every tool page.
   Appended after each page's own CSS (gen_web.py), so it only needs to (1) redefine the colour tokens the
   pages already use, (2) restyle the few structural pieces that carried the old look: nav pills, filled
   header bands, bordered cards, 900-weight headings, lime buttons.  #rzf is replaced per page.
   Direction: a private study — near-black warm ground, antique-gold accent used sparingly, serif numerals.
   ============================================================================ */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');

#rzf{
  --bg:#0C0E12;        /* page ground */
  --card:#15181F;      /* raised surface */
  --card2:#1C2029;     /* second level (tiles inside cards) */
  --line:#262B36;      /* hairlines; used far less than before */
  --ink:#E8E4DA;       /* primary text: warm paper */
  --mut:#8A8F99;       /* secondary text */
  --ac:#C9A961;        /* the one accent: antique gold */
  --lime:#C9A961;      /* legacy token name -> gold, so old "active" states pick up the accent */
  --gold:#C9A961;
  --red:#C8534F;       /* loss */
  --up:#4FA37A;        /* gain */
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  background:var(--bg);color:var(--ink);border-radius:0;padding:18px 22px 48px;line-height:1.75;
  font-feature-settings:'tnum' 1,'lnum' 1;
}
#rzf *{font-family:inherit}
#rzf a{color:var(--ac);text-decoration-color:rgba(201,169,97,.5)}
#rzf a:hover{color:var(--ink)}

/* ---------- navigation: a quiet text row, gold underline on the current page ---------- */
#rzf .nav{gap:2px 22px;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:0}
#rzf .nav a{padding:10px 2px 12px;border:0;border-radius:0;background:none;color:var(--mut)!important;font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
#rzf .nav a:hover{color:var(--ink)!important}
#rzf .nav a.on{background:none;color:var(--ink)!important;border-bottom-color:var(--ac)}

/* ---------- type ---------- */
#rzf h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px;font-variation-settings:'opsz' 72}
#rzf .sub{font-size:14px;color:var(--mut);max-width:72ch;margin-bottom:18px}
#rzf h3{font-weight:600;font-size:15.5px;color:var(--ink);letter-spacing:0}
#rzf b,#rzf strong{font-weight:600}
#rzf .co,#rzf .rzd .co{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.01em}
#rzf .co small{color:var(--ac);font-family:'Vazirmatn',sans-serif;font-weight:500}
#rzf .px .p,#rzf .sc .v,#rzf .vbig b,#rzf .rev .bx .big,#rzf .snap b,#rzf .stats b,#rzf .st .v{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-variation-settings:'opsz' 36}
#rzf .px .p{font-size:30px}
#rzf .st .v{font-size:19px}

/* ---------- surfaces: tone instead of borders ---------- */
#rzf .card{background:var(--card);border:0;border-radius:14px;padding:16px 18px;margin-bottom:12px}
#rzf .card .card{background:var(--card2)}
#rzf .st,#rzf .snap div,#rzf .vbig div,#rzf .ist4 div,#rzf .ab-grid>div,#rzf .vcol,#rzf .sc,#rzf .rev .bx,#rzf .perf div,#rzf .relc,#rzf .stats div{background:var(--card2);border:0}
#rzf .relc:hover{border:0;box-shadow:inset 0 0 0 1px var(--ac);transform:none}
#rzf .wide2 .card,#rzf .charts .card,#rzf .two .card{background:var(--card)}
#rzf .tblwrap,#rzf .tw{border:0;border-radius:10px}
#rzf .charts .card{cursor:zoom-in}

/* ---------- table heads: hairline, no filled band ---------- */
#rzf .tbl th,#rzf th,#rzf .proj th,#rzf .sens th,#rzf .antbl th,#rzf table.itb th{background:transparent;color:var(--mut);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--ac);padding:8px 8px}
#rzf .tbl th.grp{border-bottom:0;color:var(--mut)}
#rzf td{border-bottom:1px solid #1A1E26}
#rzf .tbl td.sep{border-left-color:var(--line)}
#rzf tr.sec td,#rzf .sec td{color:var(--ac);font-weight:600;background:transparent}
#rzf th.ttm,#rzf td.ttm{background:rgba(201,169,97,.07);color:var(--ink)}
#rzf th.ttm{color:var(--ac)}

/* ---------- buttons, chips, inputs ---------- */
#rzf .btn{background:var(--ac);color:#15120A!important;font-weight:600;border-radius:10px;padding:9px 18px}
#rzf .btn.ghost{background:transparent;color:var(--ink)!important;border:1px solid var(--line)}
#rzf .btn.ghost:hover{border-color:var(--ac)}
#rzf .lnk{color:var(--ac)}
#rzf .chip,#rzf .rng button,#rzf .tabs button{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500;border-radius:999px}
#rzf .chip:hover,#rzf .rng button:hover{border-color:var(--ac);color:var(--ink)}
#rzf .rng button.on,#rzf .tabs button.on,#rzf .chip.on{background:transparent;border-color:var(--ac);color:var(--ac);font-weight:600}
#rzf input,#rzf select,#rzf .pin,#rzf .tbl input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;font-weight:500}
#rzf input:focus,#rzf select:focus,#rzf .tbl input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(201,169,97,.15)}
#rzf .search input{font-size:17px;padding:12px 16px}
#rzf .sugg{background:var(--card2);border:1px solid var(--line)}
#rzf .card:has(.sugg){overflow:visible}  /* the shop theme clips .card (overflow:hidden); search suggestions must hang out of the card */
#rzf .sugg{max-height:min(430px,62vh)!important}
#rzf .sugg div:hover{background:#242934}
#rzf .badge{background:rgba(201,169,97,.12);color:var(--ac)}
#rzf .vtag{font-weight:600;border-radius:8px}

/* ---------- semantic colours: muted gain / loss; gold is never "good", it is "important" ---------- */
#rzf .up{color:var(--up)}#rzf .dn{color:var(--red)}
#rzf .vrow.ok b{background:var(--up)}#rzf .vrow.no b{background:var(--red)}
#rzf .vrow.ok em{color:var(--up)}#rzf .vrow.no em{color:var(--red)}
#rzf .good{background:rgba(79,163,122,.16);color:var(--up)}
#rzf .bad{background:rgba(200,83,79,.16);color:#E2807C}
#rzf .mid{background:rgba(201,169,97,.14);color:var(--ac)}
#rzf .vsum .up{color:var(--up)}

/* ---------- quieter secondary text, no 900 weights left ---------- */
#rzf .meta,#rzf .xnote,#rzf .note,#rzf .mut2,#rzf .st .k,#rzf .st .s{color:var(--mut);font-weight:400}
#rzf .stats small,#rzf .snap small,#rzf .vbig small{font-weight:500}
#rzf .quota{color:var(--mut)}
#rzf .tk{color:var(--ac);font-weight:600}
#rzf .sc{color:#15120A;font-weight:600}

/* ---------- the one motion: hero fades in on first paint ---------- */
@media (prefers-reduced-motion:no-preference){
  #rzf .card:first-of-type .head{animation:rz-in .45s ease-out both}
  @keyframes rz-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
#rzf :focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* ---------- phones: nav becomes one scrollable row; smaller display sizes ---------- */
@media (max-width:760px){
  #rzf{padding:12px 14px 40px}
  #rzf .nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:0 18px;scrollbar-width:none;margin-bottom:14px;padding-bottom:0}
  #rzf .nav::-webkit-scrollbar{display:none}
  #rzf .nav{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}  /* hint: the row scrolls */
  #rzf .nav a{white-space:nowrap;font-size:13.5px;padding:8px 2px 10px;flex:none}
  #rzf h1{font-size:23px}
  #rzf .sub{font-size:13.5px;margin-bottom:12px}
  #rzf .co{font-size:21px}
  #rzf .px .p{font-size:26px}
  #rzf .card{padding:14px;border-radius:12px}
  #rzf .search input{font-size:16px;padding:11px 14px}
}

/* subscriber login / account button (the theme header is off, so this is the only way in) */
#rzf .acctbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#rzf .acctbar .qk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink)!important;border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none!important;white-space:nowrap}
#rzf .acctbar .qk:hover{border-color:var(--gold);color:var(--gold)!important}
#rzf .acctbar .qcont{border-color:rgba(201,169,97,.6);color:var(--gold)!important}
#rzf .acctbar .acct{margin-inline-start:auto}
@media(max-width:420px){#rzf .acctbar{gap:5px}#rzf .acctbar .qk,#rzf .acctbar .acct{font-size:12px;padding:4px 9px}}
@media(max-width:360px){#rzf .acctbar{gap:4px}#rzf .acctbar .qk,#rzf .acctbar .acct{font-size:11px;padding:3px 7px}}
#rzf .acct{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:#15120a!important;background:var(--gold);border-radius:999px;padding:5px 14px;text-decoration:none!important}
#rzf .acct.in{background:transparent;color:var(--gold)!important;border:1px solid var(--gold)}

<script>
(function(){

function loadScreener(){var full=function(){return fetch(API+'/screener.json').then(function(r){return r.json()})};

function liveRow(r){var I=function(k){return C[k]},Q=RZQ&&RZQ.q[r[I('t')]],p0=r[I('price')];if(!Q||!(Q[0]>0)||!p0)return;var f=Q[0]/p0;
  var o={pe:r[I('pe')],pf:r[I('pfcf')],pg:r[I('peg')],fu:r[I('fair_up')],sv:r[I('s_value')]};
  r[I('price')]=Q[0];r.chg=Q[1];if(r[I('mcap')]!=null)r[I('mcap')]*=f;
  ['pe','pfcf','ps','pb','peg','fwd_pe','fwd_ps','fwd_pfcf'].forEach(function(k){if(I(k)!=null&&r[I(k)]!=null)r[I(k)]*=f});
  ['divy','fcf_yield','shy'].forEach(function(k){if(I(k)!=null&&r[I(k)]!=null)r[I(k)]/=f});

    var cs=Math.max(0,Math.min(1,o.sv-c4(o.pe,o.pf,o.pg,o.fu))),pe=r[I('pe')];if(spe!=null&&pe!=null&&o.pe!=null&&((o.pe<spe)!==(pe<spe)))cs=pe<spe?1:0;

  var res=rzRank(ROWS,q,function(r){return r[C.t]},function(r){return r[C.n]});
  box.innerHTML=res.map(function(r){return '<div data-t="'+esc(r[C.t])+'"><span>'+esc(r[C.n])+'</span><b>'+esc(r[C.t])+'</b></div>'}).join('');box.style.display=res.length?'block':'none'});
  box.addEventListener('click',function(e){var d=e.target.closest('div[data-t]');if(!d)return;box.style.display='none';inp.value='';onPick(d.dataset.t)});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=inp.value.trim().toUpperCase();if(BY[t]){box.style.display='none';inp.value='';onPick(t)}}})}

var NAMES={"VOO": "صندوق اس‌اند‌پی ۵۰۰ ونگارد", "IVV": "صندوق هسته‌ای اس‌اند‌پی ۵۰۰ آی‌شیرز", "SPY": "صندوق اس‌اند‌پی ۵۰۰ اس‌پی‌دی‌آر", "VTI": "صندوق کل بازار سهام ونگارد", "QQQ": "صندوق نزدک ۱۰۰ اینوسکو", "VUG": "صندوق سهام رشدی ونگارد", "VTV": "صندوق سهام ارزشی ونگارد", "VIG": "صندوق رشد سود نقدی ونگارد", "SCHD": "صندوق سهام سود نقدی آمریکا چارلز شواب", "VYM": "صندوق سود نقدی بالای ونگارد", "DGRO": "صندوق هسته‌ای رشد سود نقدی آی‌شیرز", "IWF": "صندوق راسل ۱۰۰۰ رشدی آی‌شیرز", "IWD": "صندوق راسل ۱۰۰۰ ارزشی آی‌شیرز", "IWM": "صندوق راسل ۲۰۰۰ آی‌شیرز", "IJH": "صندوق هسته‌ای اس‌اند‌پی میان‌رده آی‌شیرز", "IJR": "صندوق هسته‌ای اس‌اند‌پی کوچک آی‌شیرز", "VO": "صندوق شرکت‌های متوسط ونگارد", "VB": "صندوق شرکت‌های کوچک ونگارد", "SPYM": "صندوق پرتفوی اس‌اند‌پی ۵۰۰ اس‌پی‌دی‌آر", "RSP": "صندوق اس‌اند‌پی ۵۰۰ هم‌وزن اینوسکو", "QUAL": "صندوق فاکتور کیفیت ام‌اس‌سی‌آی آمریکا آی‌شیرز", "MGK": "صندوق غول‌های رشدی ونگارد", "VV": "صندوق شرکت‌های بزرگ ونگارد", "ITOT": "صندوق هسته‌ای کل بازار آمریکا آی‌شیرز", "SCHX": "صندوق شرکت‌های بزرگ آمریکا چارلز شواب", "VEA": "صندوق کشورهای توسعه‌یافته ونگارد", "VXUS": "صندوق کل سهام بین‌المللی ونگارد", "IEFA": "صندوق هسته‌ای ای‌اِی‌اف‌ای آی‌شیرز", "VWO": "صندوق بازارهای نوظهور ونگارد", "IEMG": "صندوق هسته‌ای بازارهای نوظهور آی‌شیرز", "EFA": "صندوق ای‌اِی‌اف‌ای ام‌اس‌سی‌آی آی‌شیرز", "VT": "صندوق کل سهام جهان ونگارد", "VGK": "صندوق اروپای ونگارد", "VEU": "صندوق کل جهان بدون آمریکا ونگارد", "VGT": "صندوق فناوری اطلاعات ونگارد", "XLK": "صندوق بخش فناوری اس‌پی‌دی‌آر", "SMH": "صندوق نیمه‌هادی ون‌اِک", "SOXX": "صندوق نیمه‌هادی آی‌شیرز", "XLF": "صندوق بخش مالی اس‌پی‌دی‌آر", "XLV": "صندوق بخش سلامت اس‌پی‌دی‌آر", "XLE": "صندوق بخش انرژی اس‌پی‌دی‌آر", "XLI": "صندوق بخش صنعتی اس‌پی‌دی‌آر", "VNQ": "صندوق املاک ونگارد", "VHT": "صندوق سلامت ونگارد", "BND": "صندوق کل بازار اوراق قرضه ونگارد", "AGG": "صندوق هسته‌ای اوراق قرضه‌ی آمریکا آی‌شیرز", "BNDX": "صندوق کل اوراق قرضه‌ی بین‌المللی ونگارد", "GLD": "صندوق طلای اس‌پی‌دی‌آر", "IAU": "صندوق طلای آی‌شیرز", "IBIT": "صندوق بیت‌کوین آی‌شیرز"};
/* Thin loader for the ETF section. Each page is an HTML fragment built by etf_fa_web.py with
   etf_pages.py (the builder the English site uses), under web/etf/. Address: #etf/ = the list,
   #etf/voo/ = one fund. Free on the Persian site: the S&P 500 funds; the rest needs Stock Pro. */
var FBASE = 'https://raw.githubusercontent.com/mrezahajilou-ops/stock-data/main/web/etf/';
var FREE = {VOO: 1, IVV: 1, SPY: 1, SPYM: 1, RSP: 1};

    var a = tr.querySelector('a[href^="#etf/"]'); if (!a) return;
